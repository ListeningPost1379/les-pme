[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "les"
dynamic = ["version"]
description = "LES-PME: trainable blocked and particle-mesh Ewald extensions to Latent Ewald Summation"
readme = "README.md"
license = "CC-BY-NC-4.0"
authors = [
    {name = "Bingqing Cheng"},
    {name = "Dehan Cao", email = "caodehan@gmail.com"},
]
maintainers = [
    {name = "Dehan Cao", email = "caodehan@gmail.com"},
]
dependencies = [
    "torch>=2.5.0",
    "numpy",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
yaml = ["PyYAML"]

[project.urls]
Homepage = "https://github.com/ListeningPost1379/les-pme"
Documentation = "https://github.com/ListeningPost1379/les-pme/tree/main/docs"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]  # get version from src/les/_version.py
version = {attr = "les._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["les.tests*"]
